x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-no-new-privileges: &no-new-privileges
  security_opt:
    - no-new-privileges:true

# =============================================================================
# Networks
# =============================================================================
networks:
  proxy:
    name: proxy
  backend:
    name: backend

# =============================================================================
# Volumes
# =============================================================================
volumes:
  pg_data:
  vikunja_files:
  letsencrypt:
  caldav_sync_data:
  n8n_data:

# =============================================================================
# Services
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # Traefik v3.6 — reverse proxy
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.6.9
    restart: unless-stopped
    <<: [*default-logging, *no-new-privileges]
    command:
      - --log.level=INFO
      - --api.dashboard=true
      - --api.insecure=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      # Entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # HTTP → HTTPS redirect
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      # Let's Encrypt
      - --certificatesresolvers.myresolver.acme.httpchallenge=true
      - --certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    networks:
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    labels:
      - traefik.enable=true
      # Dashboard
      - traefik.http.routers.dashboard.rule=Host(`${BOTS_HOSTNAME}`) && PathPrefix(`/dashboard`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.tls=true
      - traefik.http.routers.dashboard.tls.certresolver=myresolver
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.middlewares=auth@docker
      # Basic auth middleware
      - traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_DASH_USER}
      - traefik.http.middlewares.auth.basicauth.removeheader=true
      # WUD — не мониторить Traefik (обновляем вручную)
      - wud.watch=false

  # ---------------------------------------------------------------------------
  # Nginx — landing page
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    <<: [*default-logging, *no-new-privileges]
    networks:
      - proxy
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.nginx.rule=Host(`${BOTS_HOSTNAME}`)
      - traefik.http.routers.nginx.entrypoints=websecure
      - traefik.http.routers.nginx.tls=true
      - traefik.http.routers.nginx.tls.certresolver=myresolver
      - traefik.http.services.nginx.loadbalancer.server.port=80
      - wud.watch=true

  # ---------------------------------------------------------------------------
  # Home Bot
  # ---------------------------------------------------------------------------
  home-bot:
    image: ghcr.io/nkdab/home-bot:latest
    restart: unless-stopped
    <<: [*default-logging, *no-new-privileges]
    env_file:
      - .env
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.home-bot.rule=Host(`${BOTS_HOSTNAME}`) && PathPrefix(`/telegram`)
      - traefik.http.routers.home-bot.entrypoints=websecure
      - traefik.http.routers.home-bot.tls=true
      - traefik.http.routers.home-bot.tls.certresolver=myresolver
      - traefik.http.services.home-bot.loadbalancer.server.port=3000
      - wud.watch=true

  # ---------------------------------------------------------------------------
  # What's Up Docker (WUD) — замена Watchtower
  # Мониторинг обновлений образов с web-UI на порту 3000
  # ---------------------------------------------------------------------------
  wud:
    image: ghcr.io/getwud/wud:latest
    restart: unless-stopped
    <<: [*default-logging, *no-new-privileges]
    read_only: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - WUD_WATCHER_LOCAL_CRON=0 0 4 * * *
      - WUD_WATCHER_LOCAL_WATCHBYDEFAULT=false
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.wud.rule=Host(`${WUD_HOSTNAME}`)
      - traefik.http.routers.wud.entrypoints=websecure
      - traefik.http.routers.wud.tls=true
      - traefik.http.routers.wud.tls.certresolver=myresolver
      - traefik.http.services.wud.loadbalancer.server.port=3000
      - traefik.http.routers.wud.middlewares=auth@docker
      - wud.watch=false

  # ---------------------------------------------------------------------------
  # Shared PostgreSQL 18
  #
  # ⚠️  ВНИМАНИЕ: Обновление с PG 16 → 18 требует миграции данных!
  #     1. pg_dumpall -U postgres > backup.sql   (на старом PG 16)
  #     2. Остановить стек, удалить volume pg_data
  #     3. Запустить с новым PG 18
  #     4. psql -U postgres < backup.sql
  #docker
  #     Начиная с PG 18, PGDATA = /var/lib/postgresql/18/docker
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    <<: [*default-logging, *no-new-privileges]
    shm_size: 128mb
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
    labels:
      - wud.watch=true

