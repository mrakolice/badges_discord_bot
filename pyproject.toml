[project]
name = "twitch-badge-bot"
version = "0.1.0"
description = "Discord bot that notifies channels about Twitch Drops and reward campaigns"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31",
    "jinja2>=3.1",
    "pydantic>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a running PostgreSQL (TEST_DATABASE_URL)"]
