# Twitch Badge Bot stack. Postgres and Traefik are NOT started here: they live in the
# infra stack (docker-compose.infra.yml); this stack joins its networks as external.
#
#   docker compose --profile bootstrap run --rm db-bootstrap   # once: roles + database
#   docker compose up                                          # build + apply migrations
#   docker compose --profile bot up -d                         # migrations, then the bot
name: twitch-badge-bot

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
  init: true

x-app: &app
  image: twitch-badge-bot:${BOT_IMAGE_TAG:-local}
  build:
    context: .
    target: runtime
  <<: [*default-logging, *hardening]
  pids_limit: 128

# =============================================================================
# Networks (owned by the infra stack)
# =============================================================================
networks:
  backend:
    name: ${BACKEND_NETWORK:-backend}
    external: true
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true

# =============================================================================
# Services
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # One-time DB bootstrap on the shared Postgres (superuser). Idempotent.
  # ---------------------------------------------------------------------------
  db-bootstrap:
    image: postgres:18-alpine
    profiles: [bootstrap]
    restart: "no"
    <<: [*default-logging, *hardening]
    user: postgres
    environment:
      PGHOST: ${POSTGRES_HOST:-postgres}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGUSER: ${POSTGRES_SUPERUSER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      PGDATABASE: postgres
      BOT_DB_NAME: ${BOT_DB_NAME:-twitch_badge_bot}
      BOT_DB_OWNER: ${BOT_DB_OWNER:-twitch_bot_owner}
      BOT_DB_OWNER_PASSWORD: ${BOT_DB_OWNER_PASSWORD:-}
      BOT_DB_APP_USER: ${BOT_DB_APP_USER:-twitch_bot_app}
      BOT_DB_APP_PASSWORD: ${BOT_DB_APP_PASSWORD:-}
    volumes:
      - ./sql/bootstrap:/bootstrap:ro
    command: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/bootstrap/create_roles.psql"]
    networks:
      - backend
    labels:
      - wud.watch=false

  # ---------------------------------------------------------------------------
  # Migrations: one-shot, runs as the schema owner on every `up`. Applies only
  # what is missing in schema_migrations; advisory lock guards parallel runs.
  # ---------------------------------------------------------------------------
  migrate:
    <<: *app
    restart: "no"
    command: ["python", "-m", "src.migrate"]
    mem_limit: 128m
    environment:
      DATABASE_URL: postgresql://${BOT_DB_OWNER:-twitch_bot_owner}:${BOT_DB_OWNER_PASSWORD:?BOT_DB_OWNER_PASSWORD is required}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${BOT_DB_NAME:-twitch_badge_bot}
      MIGRATE_WAIT_SECONDS: "60"
    networks:
      - backend
    labels:
      - wud.watch=false

  # ---------------------------------------------------------------------------
  # Bot: starts only after migrations succeeded. Connects as the DML-only role
  # and receives only the variables it needs (no superuser/owner secrets).
  # In the `bot` profile until src/main.py exists.
  # ---------------------------------------------------------------------------
  bot:
    <<: *app
    profiles: [bot]
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${BOT_DB_APP_USER:-twitch_bot_app}:${BOT_DB_APP_PASSWORD:-}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${BOT_DB_NAME:-twitch_badge_bot}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DEFAULT_NOTIFICATION_CHANNEL_ID: ${DEFAULT_NOTIFICATION_CHANNEL_ID:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      DROPS_API_KEY: ${DROPS_API_KEY:-}
      CHECK_INTERVAL_MINUTES: ${CHECK_INTERVAL_MINUTES:-5}
      STREAM_NOTIFY_COOLDOWN_HOURS: ${STREAM_NOTIFY_COOLDOWN_HOURS:-6}
    networks:
      - backend
      - proxy
    labels:
      # Router is prepared but disabled: the bot has no HTTP endpoint yet.
      # Flip to true once /health (or a webhook) listens on BOT_HTTP_PORT.
      - traefik.enable=false
      - traefik.docker.network=${PROXY_NETWORK:-proxy}
      - traefik.http.routers.twitch-bot.rule=Host(`${BOTS_HOSTNAME:-localhost}`) && PathPrefix(`/twitch-bot`)
      - traefik.http.routers.twitch-bot.entrypoints=websecure
      - traefik.http.routers.twitch-bot.tls=true
      - traefik.http.routers.twitch-bot.tls.certresolver=myresolver
      - traefik.http.routers.twitch-bot.middlewares=twitch-bot-strip
      - traefik.http.middlewares.twitch-bot-strip.stripprefix.prefixes=/twitch-bot
      - traefik.http.services.twitch-bot.loadbalancer.server.port=${BOT_HTTP_PORT:-8080}
      # Locally built image: WUD has nothing to pull.
      - wud.watch=false
