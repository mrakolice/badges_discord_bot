services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: twitch_badge_bot_test
    ports:
      - "${TEST_POSTGRES_PORT:-55433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d twitch_badge_bot_test"]
      interval: 2s
      timeout: 3s
      retries: 15
